<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0c1117">
<meta name="description" content="Vera — a reality-first AI assistant that checks its own answers.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vera">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Vera — Reality-first AI</title>
<style>
  :root{--bg:#0c1117;--panel:#141b24;--panel2:#1b2430;--steel:#2a3544;--line:#1f2a37;--text:#e8edf4;--dim:#8794a6;--acc:#8ab4ff;--acc2:#5b8def;--gold:#e0b45c;--ok:#3ecf8e;--bad:#f2706b;
    --body:"Segoe UI",Inter,system-ui,-apple-system,Roboto,sans-serif;--mono:"Cascadia Mono","SF Mono",Consolas,Menlo,monospace}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:15.5px;overscroll-behavior:none}
  button{font-family:inherit;color:inherit}
  #app{display:flex;flex-direction:column;height:100dvh;max-width:780px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line);background:rgba(12,17,23,.9);backdrop-filter:blur(10px)}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.25rem;letter-spacing:.04em}
  .logo i{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,#8ab4ff,#5b8def);color:#08111f;font-style:normal;font-weight:800}
  .logo small{display:block;font-size:.68rem;font-weight:500;color:var(--dim);letter-spacing:.02em;margin-top:-2px}
  .ib{background:var(--panel2);border:1px solid var(--steel);border-radius:12px;width:40px;height:40px;cursor:pointer;display:grid;place-items:center}
  .ib svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  #chat{flex:1;overflow-y:auto;padding:16px 14px 8px;scroll-behavior:smooth}
  .msg{margin:0 0 14px;max-width:100%;animation:fade .2s ease-out}
  @keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .u{display:flex;justify-content:flex-end}.u div{background:#22406f;border:1px solid #2c5088;border-radius:18px 18px 4px 18px;padding:10px 14px;max-width:88%;white-space:pre-wrap;word-wrap:break-word}
  .a{background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:14px 15px}
  .a .txt{white-space:pre-wrap;word-wrap:break-word;line-height:1.55}
  .a .txt b{color:var(--acc)}
  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
  .tag{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--steel);color:var(--dim)}
  .tag.hi{color:var(--ok);border-color:#1f5c46}.tag.md{color:var(--gold);border-color:#6b5320}.tag.lo{color:var(--bad);border-color:#6a2d2a}
  details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
  summary{cursor:pointer;color:var(--dim);font-size:.8rem;font-weight:600;list-style:none}summary::-webkit-details-marker{display:none}
  summary::before{content:'▸ '}details[open] summary::before{content:'▾ '}
  .step{font-size:.8rem;color:var(--dim);margin:6px 0;line-height:1.45}.step b{color:var(--text)}
  .src a{color:var(--acc);text-decoration:none;font-size:.82rem;display:block;margin:4px 0;word-break:break-all}
  .err{border-color:#6a2d2a;background:rgba(242,112,107,.07)}
  .typing{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:.85rem}
  .dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--acc);margin-right:3px;animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
  .empty{text-align:center;padding:30px 10px 10px;color:var(--dim);line-height:1.6}
  .empty h1{color:var(--text);font-size:1.5rem;margin:6px 0}
  .starters{display:flex;flex-direction:column;gap:8px;margin-top:18px}
  .st{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;color:var(--text);font-size:.92rem;line-height:1.4}
  .st:active{background:var(--panel2)}
  .composer{padding:8px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:rgba(12,17,23,.95)}
  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--steel);background:var(--panel);border-radius:999px;padding:6px 12px;font-weight:600;font-size:.76rem;color:var(--dim);cursor:pointer}
  .chip.on{background:var(--text);color:#0c1117;border-color:var(--text)}
  .box{display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;resize:none;max-height:160px;min-height:46px;background:var(--panel2);border:1px solid var(--steel);color:var(--text);padding:12px 14px;border-radius:16px;font-family:var(--body);font-size:1rem;outline:none;line-height:1.4}
  textarea:focus,input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(138,180,255,.15)}
  .send{width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(180deg,#9bc0ff,#5b8def);color:#08111f;font-size:1.2rem;font-weight:800;cursor:pointer;flex:0 0 auto}.send[disabled]{opacity:.45}
  input,select{width:100%;background:var(--panel2);border:1px solid var(--steel);color:var(--text);padding:12px;border-radius:12px;font-family:var(--body);font-size:1rem;outline:none}
  label.l{display:block;font-weight:600;font-size:.76rem;color:var(--dim);margin:14px 0 6px}
  .btn{background:var(--panel2);border:1px solid var(--steel);border-radius:12px;padding:11px 15px;font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap}
  .btn.pri{background:linear-gradient(180deg,#9bc0ff,#5b8def);border-color:#5b8def;color:#08111f}.btn.danger{border-color:#6a2d2a;color:#f6a09c}.btn.sm{padding:7px 11px;font-size:.78rem}.btn.block{width:100%}
  .row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.dim{color:var(--dim)}.small{font-size:.8rem}
  #sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(4,7,11,.72)}#sheet.open{display:block}
  #sheet .pane{position:absolute;left:0;right:0;bottom:0;max-width:780px;margin:0 auto;max-height:92dvh;overflow-y:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--steel);animation:up .25s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(60px);opacity:.3}to{transform:none;opacity:1}}
  .close{float:right;background:var(--panel2);border:1px solid var(--steel);border-radius:999px;width:36px;height:36px;cursor:pointer}
  h2{font-size:1.05rem;margin:18px 0 8px}h2:first-of-type{margin-top:2px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  .conv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--panel2)}
  .conv.on{border-color:var(--acc)}
  .note{border-left:3px solid var(--gold);background:rgba(224,180,92,.08);padding:10px 12px;margin:10px 0;font-size:.82rem;line-height:1.45;color:#ecd08f;border-radius:0 10px 10px 0}
  .toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom));background:#222d3b;border:1px solid var(--steel);padding:12px 16px;border-radius:12px;z-index:40;font-size:.86rem;max-width:90vw;display:none}
  .pass{color:var(--ok);font-weight:700}.fail{color:var(--bad);font-weight:700}
  a{color:var(--acc)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><i>V</i><div>Vera<small id="sub">Reality-first AI</small></div></div>
    <div class="row">
      <button class="ib" data-act="newChat" title="New chat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="ib" data-act="history" title="Chats"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
      <button class="ib" data-act="settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></button>
    </div>
  </header>
  <div id="chat"></div>
  <div class="composer">
    <div class="chips" id="modes"></div>
    <div class="box"><textarea id="q" rows="1" placeholder="Ask anything. I will give you the realistic answer."></textarea><button class="send" id="send" data-act="send">↑</button></div>
  </div>
</div>
<div id="sheet"><div class="pane" id="pane"></div></div>
<div class="toast" id="toast"></div>

<script src="vera.js"></script>
<script>
(function () {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const KEY = 'vera_state_v1';
const DEF = { provider: 'groq', keys: {}, models: {}, bases: {}, mode: 'careful', web: true, tone: 'direct', tavily: '', profile: '' };
function load() { try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && typeof v === 'object') return v; } catch (e) {} return null; }
const S = Object.assign({ settings: Object.assign({}, DEF), convs: [], active: null, ack: false }, load() || {});
S.settings = Object.assign({}, DEF, S.settings); S.settings.keys = S.settings.keys || {}; S.settings.bases = S.settings.bases || {}; S.settings.models = S.settings.models || {};
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Could not save (storage full or blocked).'); } try { idbPut(JSON.stringify(S)); } catch (e) {} }
function idb() { return new Promise((res, rej) => { try { const r = indexedDB.open('vera', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); }
async function idbPut(v) { const d = await idb(); d.transaction('kv', 'readwrite').objectStore('kv').put(v, KEY); }
async function idbGet() { const d = await idb(); return new Promise(res => { const q = d.transaction('kv').objectStore('kv').get(KEY); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); }
async function restore() { if (S.convs.length || S.settings.keys.groq || S.settings.keys.gemini || S.settings.keys.openrouter) return; try { const v = await idbGet(); if (v) { const j = JSON.parse(v); Object.assign(S, j); S.settings = Object.assign({}, DEF, S.settings); render(); } } catch (e) {} }
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

let busy = false, stepText = '';
const P = () => Vera.PROVIDERS[S.settings.provider];
const key = () => S.settings.keys[S.settings.provider] || '';
const base = () => (S.settings.bases[S.settings.provider] || '').trim();
const mkLLM = () => Vera.createLLM({ provider: S.settings.provider, key: key(), model: S.settings.models[S.settings.provider], base: base() || undefined });
const conv = () => S.convs.find(c => c.id === S.active);
const ready = () => (!P().needsKey || !!key()) && (!P().needsBase || !!base());
function toast(m, ms) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => { t.style.display = 'none'; }, ms || 3000); }

/* ---------- rendering ---------- */
const STARTERS = [
  'I want to turn 10 euros into 20 every month with small stocks. Is that realistic?',
  'Check my plan: I will build an app, put it on GitHub and earn money from it. What are the real risks?',
  'Explain inflation simply, then tell me what it means for saving money in Germany.',
  'I train 3 days a week and want more muscle. What matters most, and what is hype?'
];
function fmt(text) {
  let h = esc(text);
  h = h.replace(/^(Bottom line|Why|What could make this wrong|Confidence|Next step):/gm, '<b>$1:</b>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  return h;
}
function msgHtml(m, i) {
  if (m.role === 'user') return '<div class="msg u"><div>' + esc(m.content) + '</div></div>';
  const x = m.meta || {};
  if (m.error) return '<div class="msg a err"><div class="txt">' + esc(m.content) + '</div><div class="meta"><button class="btn sm" data-act="retry">Try again</button><button class="btn sm" data-act="settings">Settings</button></div></div>';
  let h = '<div class="msg a"><div class="txt">' + fmt(m.content) + '</div>';
  const conf = /Confidence:\s*(Low|Medium|High)/i.exec(m.content);
  h += '<div class="meta">' + (conf ? '<span class="tag ' + ({ low: 'lo', medium: 'md', high: 'hi' }[conf[1].toLowerCase()]) + '">Confidence: ' + conf[1] + '</span>' : '') + (x.usedSearch ? '<span class="tag">checked online</span>' : '') + (x.issues && x.issues.length ? '<span class="tag md">self-corrected ' + x.issues.length + '×</span>' : '') + '<button class="btn sm" data-act="copy" data-i="' + i + '">Copy</button></div>';
  if (x.sources && x.sources.length) h += '<details><summary>Sources (' + x.sources.length + ')</summary><div class="src">' + x.sources.map(s => '<a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">[' + s.n + '] ' + esc(s.title) + '</a>').join('') + '</div></details>';
  if (x.steps && x.steps.length) h += '<details><summary>How I got this (' + x.calls + ' model calls)</summary>' + x.steps.map(s => '<div class="step"><b>' + esc(s.name) + '</b>' + (s.detail ? ' — ' + esc(s.detail) : '') + '</div>').join('') + (x.issues && x.issues.length ? '<div class="step"><b>Problems found in my first draft:</b><br>• ' + x.issues.map(esc).join('<br>• ') + '</div>' : '') + '</details>';
  return h + '</div>';
}
function render() {
  $('#sub').textContent = ready() ? P().name.replace(/ \(.*\)/, '') + ' · ' + (S.settings.models[S.settings.provider] || 'pick a model') : 'Setup needed';
  const c = conv(), chat = $('#chat');
  document.querySelectorAll('#modes .chip').forEach(b => b.classList.toggle('on', b.dataset.v === S.settings.mode || (b.dataset.act === 'toggleWeb' && S.settings.web)));
  if (!c || !c.msgs.length) {
    chat.innerHTML = '<div class="empty"><div style="font-size:2rem">🧭</div><h1>Ask me anything.</h1><div>I give the realistic answer, show how sure I am, and check myself before replying. I will say so when you are wrong.</div>' +
      (ready() ? '' : '<div class="note" style="text-align:left">First, connect a free AI model: tap <b>Settings</b> (the gear), choose a provider and paste a free key. It takes about 2 minutes.</div><button class="btn pri" data-act="settings">Set up now</button>') +
      '<div class="starters">' + STARTERS.map((s, i) => '<button class="st" data-act="starter" data-i="' + i + '">' + esc(s) + '</button>').join('') + '</div></div>';
    return;
  }
  chat.innerHTML = c.msgs.map(msgHtml).join('') + (busy ? '<div class="msg a"><div class="typing"><span class="dots"><i></i><i></i><i></i></span><span id="stepTxt">' + esc(stepText) + '</span></div></div>' : '');
  chat.scrollTop = chat.scrollHeight;
}
function renderModes() {
  $('#modes').innerHTML = [['fast', 'Fast'], ['careful', 'Careful'], ['deep', 'Deep']].map(m => '<button class="chip" data-act="mode" data-v="' + m[0] + '">' + m[1] + '</button>').join('') + '<button class="chip" data-act="toggleWeb">🌐 Look things up</button>';
}
const sheet = h => { $('#pane').innerHTML = '<button class="close" data-act="close">✕</button>' + h; $('#sheet').classList.add('open'); };
const closeSheet = () => $('#sheet').classList.remove('open');

/* ---------- sending ---------- */
function newConv() { const c = { id: 'c' + Date.now(), title: 'New chat', msgs: [], t: Date.now() }; S.convs.unshift(c); S.active = c.id; return c; }
async function send(text) {
  text = String(text || '').trim(); if (!text || busy) return;
  if (!ready()) { toast('Connect a free AI model first (Settings).'); openSettings(); return; }
  if (!S.settings.models[S.settings.provider]) { toast('Pick a model in Settings first.'); openSettings(); return; }
  let c = conv() || newConv();
  const history = c.msgs.filter(m => !m.error).map(m => ({ role: m.role, content: m.content }));
  c.msgs.push({ role: 'user', content: text }); if (c.title === 'New chat') c.title = text.slice(0, 44);
  $('#q').value = ''; autosize(); busy = true; stepText = 'Starting'; save(); render();
  const st = S.settings, llm = mkLLM();
  try {
    const r = await Vera.ask({ llm, question: text, history, mode: st.mode, web: st.web, nativeSearch: st.provider === 'gemini', tone: st.tone, profile: st.profile,
      search: q => Vera.webSearch(q, { tavilyKey: st.tavily }), onStep: (n, d) => { stepText = n + (d && n.indexOf('Fixing') !== 0 ? ': ' + d : ''); const e = $('#stepTxt'); if (e) e.textContent = stepText; } });
    c.msgs.push({ role: 'assistant', content: r.text, meta: { steps: r.steps, issues: r.issues, sources: r.sources, calls: r.calls, usedSearch: r.usedSearch, kind: r.kind } });
  } catch (e) {
    c.msgs.push({ role: 'assistant', error: true, content: (e && e.message) || 'Something went wrong.' });
  }
  busy = false; save(); render();
}
function autosize() { const t = $('#q'); t.style.height = 'auto'; t.style.height = Math.min(160, t.scrollHeight) + 'px'; }

/* ---------- settings ---------- */
function openSettings() {
  const st = S.settings, p = P();
  const models = st._list && st._listFor === st.provider ? st._list : (st.models[st.provider] ? [st.models[st.provider]] : []);
  let h = '<h2>Connect a free AI model</h2><label class="l" style="margin-top:0">Provider</label><select id="sProv">' + Object.keys(Vera.PROVIDERS).map(k => '<option value="' + k + '"' + (st.provider === k ? ' selected' : '') + '>' + Vera.PROVIDERS[k].name + '</option>').join('') + '</select><div class="dim small" style="margin-top:6px">' + esc(p.note) + '</div>';
  if (p.needsBase) h += '<label class="l">Base URL</label><input type="text" id="sBase" value="' + esc(base()) + '" placeholder="https://api.openai.com/v1" autocomplete="off">';
  if (p.needsKey) h += '<label class="l">API key <a href="' + p.keyUrl + '" target="_blank" rel="noopener noreferrer" class="small">(get a free key)</a></label><input type="password" id="sKey" value="' + esc(key()) + '" autocomplete="off" placeholder="paste key here">' + (st.provider === 'gemini' && !key() && hasFEKey() ? '<button class="btn sm" style="margin-top:8px" data-act="feKey">Use the Gemini key saved in FE</button>' : '');
  else h += '<div class="note">Install Ollama from <a href="https://ollama.com/download" target="_blank" rel="noopener noreferrer">ollama.com</a>, run a model (for example <b>ollama pull qwen3:8b</b>), then start Ollama with the setting <b>OLLAMA_ORIGINS=https://776vvfyn45-commits.github.io</b>. Works on a PC browser only, not on a phone.</div>';
  h += '<label class="l">Model</label><div class="row"><select id="sModel">' + (models.length ? models.map(m => '<option' + (st.models[st.provider] === m ? ' selected' : '') + '>' + esc(m) + '</option>').join('') : '<option value="">(load the list)</option>') + '</select><button class="btn" data-act="loadModels">Load list</button></div>';
  h += '<button class="btn pri block" style="margin-top:14px" data-act="saveConn">Save & test</button>';
  h += '<h2>How it answers</h2><label class="l" style="margin-top:0">Tone</label><select id="sTone">' + [['gentle', 'Gentle (still truthful)'], ['direct', 'Direct (default)'], ['blunt', 'Blunt and short']].map(t => '<option value="' + t[0] + '"' + (st.tone === t[0] ? ' selected' : '') + '>' + t[1] + '</option>').join('') + '</select>' +
    '<div class="dim small" style="margin-top:8px"><b>Fast</b> = 2 model calls. <b>Careful</b> = drafts, attacks its own draft, fixes it (3–4 calls). <b>Deep</b> = two review rounds (up to 6 calls). More checking is more accurate but uses more of your free daily limit.</div>';
  h += '<label class="l">Optional: Tavily search key (better web results; free tier)</label><input type="password" id="sTav" value="' + esc(st.tavily) + '" autocomplete="off" placeholder="tvly-…"><div class="dim small" style="margin-top:6px">Without it, Vera uses Wikipedia' + (st.provider === 'gemini' ? ' and Google search through Gemini' : '') + '.</div>';
  h += '<h2>About you (so answers fit your life)</h2><textarea id="sProf" rows="5" style="width:100%" placeholder="Example: I live in Germany. I have a small budget (about €100). Beginner investor. I train 4×/week. I build small web apps.">' + esc(st.profile) + '</textarea><button class="btn block" style="margin-top:8px" data-act="saveProf">Save</button>';
  h += '<h2>Honesty test</h2><div class="dim small">Runs ' + Vera.REALITY_TESTS.length + ' trick questions (fake promises, flattery bait, false facts, math) and grades the answers. It uses about ' + (Vera.REALITY_TESTS.length * 3) + ' model calls.</div><button class="btn block" style="margin-top:8px" data-act="runTests">Run honesty test</button><div id="testOut"></div>';
  h += '<h2>Your data</h2><div class="dim small">Chats and keys stay only on this device.</div><div class="row" style="margin-top:8px"><button class="btn" data-act="export">Download backup</button><button class="btn danger" data-act="wipe">Erase all</button></div>';
  sheet(h);
}
function hasFEKey() { try { const j = JSON.parse(localStorage.getItem('fe_state_v1')); return !!(j && j.gemKey); } catch (e) { return false; } }
function readConn() { const st = S.settings; st.provider = $('#sProv').value; if ($('#sKey')) st.keys[st.provider] = $('#sKey').value.trim(); const m = $('#sModel').value; if (m) st.models[st.provider] = m; if ($('#sBase')) st.bases[st.provider] = $('#sBase').value.trim().replace(/\/+$/, ''); st.tone = $('#sTone').value; st.tavily = $('#sTav').value.trim(); }

async function runTests() {
  const out = $('#testOut'); if (!ready() || !S.settings.models[S.settings.provider]) { toast('Connect a model first.'); return; }
  const st = S.settings, llm = mkLLM(); let pass = 0, h = '';
  for (const t of Vera.REALITY_TESTS) {
    out.innerHTML = h + '<div class="dim small" style="margin-top:8px">Testing: ' + esc(t.prompt.slice(0, 60)) + '…</div>';
    try { const r = await Vera.ask({ llm, question: t.prompt, history: [], mode: st.mode, web: false, tone: st.tone, profile: '' }); const g = Vera.gradeTest(t, r.text); if (g.pass) pass++;
      h += '<div class="card"><div class="' + (g.pass ? 'pass' : 'fail') + '">' + (g.pass ? 'PASS' : 'CHECK') + '</div><div class="small dim">' + esc(t.prompt) + '</div><details><summary>Answer</summary><div class="small" style="white-space:pre-wrap;margin-top:6px">' + esc(r.text) + '</div></details></div>'; }
    catch (e) { h += '<div class="card"><div class="fail">ERROR</div><div class="small dim">' + esc(e.message) + '</div></div>'; if (e.code === 'LIMIT' || e.code === 'KEY') break; }
  }
  out.innerHTML = '<div style="margin-top:10px"><b>' + pass + ' / ' + Vera.REALITY_TESTS.length + ' passed</b> <span class="dim small">(an automatic check; read the answers yourself)</span></div>' + h;
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  if (e.target.id === 'sheet') { closeSheet(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return; const d = el.dataset;
  switch (d.act) {
    case 'send': send($('#q').value); break;
    case 'newChat': S.active = null; save(); render(); $('#q').focus(); break;
    case 'close': closeSheet(); render(); break;
    case 'settings': openSettings(); break;
    case 'history': sheet('<h2>Chats</h2>' + (S.convs.length ? S.convs.map(c => '<div class="conv' + (c.id === S.active ? ' on' : '') + '" data-act="open" data-id="' + c.id + '"><span>' + esc(c.title) + '</span><button class="btn sm danger" data-act="delConv" data-id="' + c.id + '">✕</button></div>').join('') : '<div class="dim">No chats yet.</div>')); break;
    case 'open': S.active = d.id; save(); closeSheet(); render(); break;
    case 'delConv': e.stopPropagation(); S.convs = S.convs.filter(c => c.id !== d.id); if (S.active === d.id) S.active = null; save(); el.closest('.conv').remove(); render(); break;
    case 'mode': S.settings.mode = d.v; save(); render(); break;
    case 'toggleWeb': S.settings.web = !S.settings.web; save(); render(); toast('Online lookup ' + (S.settings.web ? 'on' : 'off')); break;
    case 'starter': $('#q').value = STARTERS[+d.i]; autosize(); $('#q').focus(); break;
    case 'copy': { const m = conv().msgs[+d.i]; try { await navigator.clipboard.writeText(m.content); toast('Copied'); } catch (er) { toast('Copy not allowed here.'); } break; }
    case 'retry': { const c = conv(); if (!c) break; c.msgs.pop(); const u = c.msgs.pop(); save(); render(); if (u) send(u.content); break; }
    case 'feKey': try { S.settings.keys.gemini = JSON.parse(localStorage.getItem('fe_state_v1')).gemKey; save(); openSettings(); } catch (er) {} break;
    case 'loadModels': { readConn(); toast('Loading models…', 8000); try { const ids = await Vera.listModels(S.settings.provider, { key: key(), base: base() || undefined }); S.settings._list = ids; S.settings._listFor = S.settings.provider; if (!S.settings.models[S.settings.provider] || ids.indexOf(S.settings.models[S.settings.provider]) === -1) S.settings.models[S.settings.provider] = Vera.pickModel(S.settings.provider, ids); save(); openSettings(); toast(ids.length + ' models found.'); } catch (er) { toast(er.message, 6000); } break; }
    case 'saveConn': { readConn(); if (P().needsKey && !key()) { toast('Paste a key first.'); break; } if (P().needsBase && !base()) { toast('Paste the base URL first.'); break; } if (!S.settings.models[S.settings.provider]) { toast('Tap "Load list" and pick a model.'); break; }
      toast('Testing…', 15000); try { const r = await mkLLM()([{ role: 'user', content: 'Reply with the single word: ready' }], { maxTokens: 60, temperature: 0 }); save(); toast(r.text ? 'Connected ✓' : 'Connected, but the model answered with nothing. Try another model.'); render(); } catch (er) { toast(er.message, 7000); } break; }
    case 'saveProf': S.settings.profile = $('#sProf').value; save(); toast('Saved.'); break;
    case 'runTests': readConn(); save(); runTests(); break;
    case 'export': { const b = new Blob([JSON.stringify(Object.assign({}, S, { settings: Object.assign({}, S.settings, { keys: {}, tavily: '' }) }))], { type: 'application/json' }), u = URL.createObjectURL(b), l = document.createElement('a'); l.href = u; l.download = 'vera-backup.json'; l.click(); setTimeout(() => URL.revokeObjectURL(u), 2000); toast('Backup saved (keys not included).'); break; }
    case 'wipe': if (confirm('Erase all chats, settings and keys on this device?')) { try { localStorage.removeItem(KEY); } catch (er) {} location.reload(); } break;
  }
});
document.addEventListener('change', e => { if (e.target.id === 'sProv') { readConn(); S.settings._list = null; save(); openSettings(); } });
$('#q').addEventListener('input', autosize);
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(hover:hover)').matches) { e.preventDefault(); send($('#q').value); } });

renderModes(); render(); restore();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
</body>
