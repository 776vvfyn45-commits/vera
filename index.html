<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b1016">
<meta name="description" content="Vera — a friendly AI that gives you simple, honest answers.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vera">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Vera</title>
<style>
  :root{--bg:#0b1016;--bg2:#101823;--panel:#141d29;--panel2:#1b2635;--steel:#2a3748;--line:#1d2836;--text:#eaf0f7;--dim:#8997aa;--acc:#8ab4ff;--acc2:#5b8def;--user:#2b4f8a;--userT:#fff;--gold:#e0b45c;--ok:#3ecf8e;--bad:#f2706b;--glow:rgba(138,180,255,.22);
    --body:"Segoe UI",Inter,system-ui,-apple-system,Roboto,sans-serif;--mono:"Cascadia Mono","SF Mono",Consolas,Menlo,monospace}
  [data-theme=light]{--bg:#f6f8fb;--bg2:#ffffff;--panel:#ffffff;--panel2:#eef2f8;--steel:#d3dbe7;--line:#e3e9f1;--text:#162033;--dim:#66758a;--acc:#2f66d6;--acc2:#2f66d6;--user:#2f66d6;--userT:#fff;--glow:rgba(47,102,214,.18)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;overscroll-behavior:none}
  body{background:radial-gradient(900px 500px at 85% -10%,var(--glow),transparent 60%),radial-gradient(700px 400px at -10% 10%,rgba(224,180,92,.07),transparent 60%),var(--bg)}
  button{font-family:inherit;color:inherit}
  #app{display:flex;flex-direction:column;height:100dvh;max-width:760px;margin:0 auto}
  header{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 8px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.2rem}
  .av{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#a5c4ff,#5b8def 60%,#7c5cff);color:#08111f;font-weight:800;font-size:.95rem;box-shadow:0 0 0 4px var(--glow);flex:0 0 auto}
  .logo small{display:block;font-size:.7rem;font-weight:500;color:var(--dim);margin-top:-2px}
  .ib{background:transparent;border:0;border-radius:50%;width:40px;height:40px;cursor:pointer;display:grid;place-items:center;color:var(--dim)}
  .ib:hover,.ib:active{background:var(--panel2);color:var(--text)}
  .ib svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  #chat{flex:1;overflow-y:auto;padding:8px 16px 14px;scroll-behavior:smooth}
  .row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}.dim{color:var(--dim)}.small{font-size:.8rem}
  /* conversation */
  .turn{margin:0 0 18px;animation:fade .25s ease-out}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .u{display:flex;justify-content:flex-end}.u div{background:var(--user);color:var(--userT);border-radius:20px 20px 6px 20px;padding:10px 15px;max-width:86%;white-space:pre-wrap;word-wrap:break-word;line-height:1.45}
  .a{display:flex;gap:10px;align-items:flex-start}.a .av{width:30px;height:30px;font-size:.8rem;box-shadow:none;margin-top:2px}
  .a .body{min-width:0;flex:1}
  .txt{line-height:1.6;word-wrap:break-word}.txt p{margin:0 0 10px}.txt p:last-child{margin-bottom:0}
  .txt ul,.txt ol{margin:6px 0 10px;padding-left:22px}.txt li{margin:4px 0}.txt h4{margin:14px 0 6px;font-size:1rem}
  .txt b{font-weight:700}.txt code{background:var(--panel2);padding:1px 6px;border-radius:6px;font-family:var(--mono);font-size:.88em}
  .txt sup{color:var(--acc);font-weight:700;font-size:.7em}
  .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
  .mini{background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:.76rem;color:var(--dim);cursor:pointer}
  .mini:hover,.mini:active{border-color:var(--steel);color:var(--text)}
  .fu{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:.86rem;color:var(--text);cursor:pointer;text-align:left}
  .fu:active{background:var(--panel2)}
  .fus{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  details.how{margin-top:8px}details.how summary{cursor:pointer;color:var(--dim);font-size:.78rem;list-style:none}details.how summary::-webkit-details-marker{display:none}
  details.how .in{margin-top:6px;font-size:.8rem;color:var(--dim);line-height:1.5}
  details.how a{color:var(--acc);word-break:break-all;display:block;margin:3px 0}
  .err .txt{color:#f6a09c}
  .typing{display:flex;align-items:center;gap:8px;color:var(--dim);font-size:.88rem;padding-top:6px}
  .dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-right:4px;animation:b 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}
  .caret::after{content:'▍';color:var(--acc);animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
  /* welcome */
  .hello{padding:26px 4px 6px}.hello .big{font-size:1.9rem;font-weight:700;line-height:1.2;background:linear-gradient(90deg,var(--text),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hello p{color:var(--dim);margin:8px 0 0;line-height:1.5}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
  .cardb{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:left;cursor:pointer;color:var(--text);font-size:.9rem;line-height:1.4;min-height:96px;transition:transform .12s,border-color .15s}
  .cardb:active{transform:scale(.98)}.cardb:hover{border-color:var(--acc)}.cardb span{display:block;font-size:1.4rem;margin-bottom:8px}
  .note{border-left:3px solid var(--gold);background:rgba(224,180,92,.09);padding:10px 12px;margin:14px 0;font-size:.84rem;line-height:1.45;color:var(--text);border-radius:0 10px 10px 0}
  /* composer */
  .composer{padding:6px 12px calc(10px + env(safe-area-inset-bottom))}
  .opts{display:flex;gap:6px;overflow-x:auto;padding:0 2px 8px;scrollbar-width:none}.opts::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:.74rem;color:var(--dim);cursor:pointer}
  .chip.on{background:var(--panel2);color:var(--text);border-color:var(--steel)}
  .pill{display:flex;align-items:flex-end;gap:4px;background:var(--panel);border:1px solid var(--steel);border-radius:26px;padding:6px 6px 6px 8px;box-shadow:0 4px 24px rgba(0,0,0,.18);transition:border-color .15s,box-shadow .15s}
  .pill:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px var(--glow)}
  textarea{flex:1;resize:none;max-height:150px;min-height:40px;background:transparent;border:0;color:var(--text);padding:9px 6px;font-family:var(--body);font-size:1rem;outline:none;line-height:1.4}
  .send{width:40px;height:40px;border-radius:50%;border:0;background:linear-gradient(180deg,#a5c4ff,#5b8def);color:#08111f;font-size:1.15rem;font-weight:800;cursor:pointer;flex:0 0 auto}.send[disabled]{opacity:.4}
  .mic{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--dim);cursor:pointer;flex:0 0 auto;display:grid;place-items:center}.mic svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .mic.on{background:rgba(242,112,107,.18);color:var(--bad);animation:pulse 1.2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(242,112,107,.12)}}
  input,select{width:100%;background:var(--panel2);border:1px solid var(--steel);color:var(--text);padding:12px;border-radius:12px;font-family:var(--body);font-size:1rem;outline:none}
  input:focus,select:focus,.sheetta:focus{border-color:var(--acc)}
  .sheetta{width:100%;background:var(--panel2);border:1px solid var(--steel);color:var(--text);padding:12px;border-radius:12px;font-family:var(--body);font-size:1rem;outline:none;resize:vertical}
  label.l{display:block;font-weight:600;font-size:.76rem;color:var(--dim);margin:14px 0 6px}
  .btn{background:var(--panel2);border:1px solid var(--steel);border-radius:12px;padding:11px 15px;font-weight:600;font-size:.88rem;cursor:pointer;white-space:nowrap}
  .btn.pri{background:linear-gradient(180deg,#a5c4ff,#5b8def);border-color:#5b8def;color:#08111f}.btn.danger{border-color:#6a2d2a;color:#f6a09c}.btn.block{width:100%}.btn.sm{padding:7px 11px;font-size:.78rem}
  #sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(4,7,11,.6)}#sheet.open{display:block}
  #sheet .pane{position:absolute;left:0;right:0;bottom:0;max-width:760px;margin:0 auto;max-height:92dvh;overflow-y:auto;background:var(--panel);border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--steel);animation:up .25s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(60px);opacity:.3}to{transform:none;opacity:1}}
  .close{float:right;background:var(--panel2);border:1px solid var(--steel);border-radius:999px;width:36px;height:36px;cursor:pointer}
  h2{font-size:1.05rem;margin:20px 0 8px}h2:first-of-type{margin-top:2px}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
  .conv{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;background:var(--panel2)}.conv.on{border-color:var(--acc)}
  .toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom));background:var(--panel2);border:1px solid var(--steel);padding:11px 16px;border-radius:14px;z-index:40;font-size:.86rem;max-width:90vw;display:none;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .pass{color:var(--ok);font-weight:700}.fail{color:var(--bad);font-weight:700}a{color:var(--acc)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><div class="av">V</div><div>Vera<small id="sub">Your honest helper</small></div></div>
    <div class="row">
      <button class="ib" data-act="newChat" title="New chat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="ib" data-act="history" title="Chats"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
      <button class="ib" data-act="settings" title="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></button>
    </div>
  </header>
  <div id="chat"></div>
  <div class="composer">
    <div class="opts" id="modes"></div>
    <div class="pill">
      <button class="mic" id="mic" data-act="mic" title="Speak" style="display:none"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
      <textarea id="q" rows="1" placeholder="Ask me anything…"></textarea>
      <button class="send" id="send" data-act="send">↑</button>
    </div>
  </div>
</div>
<div id="sheet"><div class="pane" id="pane"></div></div>
<div class="toast" id="toast"></div>

<script src="vera.js"></script>
<script>
(function () {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const KEY = 'vera_state_v1';
const DEF = { provider: 'groq', keys: {}, models: {}, bases: {}, mode: 'careful', web: true, tone: 'direct', tavily: '', profile: '', name: 'Athira', theme: 'dark' };
function load() { try { const v = JSON.parse(localStorage.getItem(KEY)); if (v && typeof v === 'object') return v; } catch (e) {} return null; }
const S = Object.assign({ settings: Object.assign({}, DEF), convs: [], active: null }, load() || {});
S.settings = Object.assign({}, DEF, S.settings); S.settings.keys = S.settings.keys || {}; S.settings.models = S.settings.models || {}; S.settings.bases = S.settings.bases || {};
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Could not save (storage full or blocked).'); } try { idbPut(JSON.stringify(S)); } catch (e) {} }
function idb() { return new Promise((res, rej) => { try { const r = indexedDB.open('vera', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } }); }
async function idbPut(v) { const d = await idb(); d.transaction('kv', 'readwrite').objectStore('kv').put(v, KEY); }
async function idbGet() { const d = await idb(); return new Promise(res => { const q = d.transaction('kv').objectStore('kv').get(KEY); q.onsuccess = () => res(q.result); q.onerror = () => res(null); }); }
async function restore() { if (S.convs.length || Object.keys(S.settings.keys).some(k => S.settings.keys[k])) return; try { const v = await idbGet(); if (v) { const j = JSON.parse(v); Object.assign(S, j); S.settings = Object.assign({}, DEF, S.settings); applyTheme(); render(); } } catch (e) {} }
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
function applyTheme() { document.documentElement.setAttribute('data-theme', S.settings.theme === 'light' ? 'light' : 'dark'); const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = S.settings.theme === 'light' ? '#f6f8fb' : '#0b1016'; }

let busy = false, stepText = '', typing = null;
const P = () => Vera.PROVIDERS[S.settings.provider];
const key = () => S.settings.keys[S.settings.provider] || '';
const base = () => (S.settings.bases[S.settings.provider] || '').trim();
const mkLLM = () => Vera.createLLM({ provider: S.settings.provider, key: key(), model: S.settings.models[S.settings.provider], base: base() || undefined });
const conv = () => S.convs.find(c => c.id === S.active);
const ready = () => (!P().needsKey || !!key()) && (!P().needsBase || !!base());
function toast(m, ms) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => { t.style.display = 'none'; }, ms || 3000); }

/* ---------- tiny markdown ---------- */
function inline(s) { return esc(s).replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?]|$)/g, '$1<i>$2</i>').replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\[(\d{1,2})\]/g, '<sup>$1</sup>'); }
function md(text) {
  const lines = String(text || '').split('\n'); let out = '', list = null, para = [];
  const flushP = () => { if (para.length) { out += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; } };
  const closeL = () => { if (list) { out += '</' + list + '>'; list = null; } };
  lines.forEach(l => {
    let m;
    if (!l.trim()) { flushP(); closeL(); return; }
    if ((m = /^\s*#{1,4}\s+(.*)/.exec(l))) { flushP(); closeL(); out += '<h4>' + inline(m[1]) + '</h4>'; return; }
    if ((m = /^\s*[-*•]\s+(.*)/.exec(l))) { flushP(); if (list !== 'ul') { closeL(); out += '<ul>'; list = 'ul'; } out += '<li>' + inline(m[1]) + '</li>'; return; }
    if ((m = /^\s*\d+[.)]\s+(.*)/.exec(l))) { flushP(); if (list !== 'ol') { closeL(); out += '<ol>'; list = 'ol'; } out += '<li>' + inline(m[1]) + '</li>'; return; }
    closeL(); para.push(l);
  });
  flushP(); closeL(); return out;
}

/* ---------- rendering ---------- */
const STARTERS = [
  ['🍝', 'How do I make a really good lasagna?'],
  ['💸', 'Is it realistic to turn 10 euros into 20 every month?'],
  ['💪', 'Give me a simple 3-day workout plan for a beginner'],
  ['🧠', 'Explain inflation like I am 15']
];
const greet = () => { const h = new Date().getHours(); return (h < 5 ? 'Still up' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening') + (S.settings.name ? ', ' + S.settings.name : ''); };
function turnHtml(m, i, last) {
  if (m.role === 'user') return '<div class="turn u"><div>' + esc(m.content) + '</div></div>';
  const x = m.meta || {};
  if (m.error) return '<div class="turn a err"><div class="av">V</div><div class="body"><div class="txt"><p>' + esc(m.content) + '</p></div><div class="acts"><button class="mini" data-act="retry">Try again</button><button class="mini" data-act="settings">Settings</button></div></div></div>';
  const isTyping = typing && typing.i === i;
  let h = '<div class="turn a"><div class="av">V</div><div class="body"><div class="txt' + (isTyping ? ' caret' : '') + '" id="t' + i + '">' + md(isTyping ? typing.shown : m.content) + '</div>';
  if (!isTyping) {
    h += '<div class="acts"><button class="mini" data-act="copy" data-i="' + i + '">Copy</button>' + (last ? '<button class="mini" data-act="regen">↻ Redo</button>' : '') + '</div>';
    if (x.usedSearch || (x.issues && x.issues.length)) {
      h += '<details class="how"><summary>' + (x.usedSearch ? '🔎 I checked this online' : '✓ I double-checked this') + (x.issues && x.issues.length ? ' and fixed ' + x.issues.length + ' thing' + (x.issues.length > 1 ? 's' : '') : '') + '</summary><div class="in">' +
        (x.sources && x.sources.length ? x.sources.map(s => '<a href="' + esc(s.url) + '" target="_blank" rel="noopener noreferrer">[' + s.n + '] ' + esc(s.title) + '</a>').join('') : '') +
        (x.issues && x.issues.length ? '<div style="margin-top:6px">Fixed in my first draft:<br>• ' + x.issues.map(esc).join('<br>• ') + '</div>' : '') + '</div></details>';
    }
    if (last && x.followups && x.followups.length) h += '<div class="fus">' + x.followups.map((f, k) => '<button class="fu" data-act="fu" data-i="' + k + '">' + esc(f) + '</button>').join('') + '</div>';
  }
  return h + '</div></div>';
}
function render(keepScroll) {
  $('#sub').textContent = ready() ? (S.settings.models[S.settings.provider] ? 'Ready' : 'Pick a model in Settings') : 'Needs a free AI connection';
  document.querySelectorAll('#modes .chip').forEach(b => b.classList.toggle('on', b.dataset.v === S.settings.mode || (b.dataset.act === 'toggleWeb' && S.settings.web)));
  const c = conv(), chat = $('#chat');
  if (!c || !c.msgs.length) {
    chat.innerHTML = '<div class="hello"><div class="big">' + esc(greet()) + '.<br>What can I help with?</div><p>Ask me anything. I will keep it simple and tell you the truth, even when it is not what you hoped to hear.</p></div>' +
      (ready() ? '' : '<div class="note">One quick step first: tap the ⚙ gear, pick a free AI (Groq is easiest) and paste its key. About 2 minutes.<br><button class="btn pri sm" style="margin-top:10px" data-act="settings">Set it up</button></div>') +
      '<div class="cards">' + STARTERS.map((s, i) => '<button class="cardb" data-act="starter" data-i="' + i + '"><span>' + s[0] + '</span>' + esc(s[1]) + '</button>').join('') + '</div>';
    return;
  }
  const lastA = (() => { for (let k = c.msgs.length - 1; k >= 0; k--) if (c.msgs[k].role === 'assistant') return k; return -1; })();
  chat.innerHTML = c.msgs.map((m, i) => turnHtml(m, i, i === lastA && !busy)).join('') + (busy ? '<div class="turn a"><div class="av">V</div><div class="body"><div class="typing"><span class="dots"><i></i><i></i><i></i></span><span id="stepTxt">' + esc(stepText) + '</span></div></div></div>' : '');
  if (!keepScroll) chat.scrollTop = chat.scrollHeight;
}
function renderModes() {
  $('#modes').innerHTML = [['fast', '⚡ Quick'], ['careful', '🧠 Smart'], ['deep', '🔬 Thorough']].map(m => '<button class="chip" data-act="mode" data-v="' + m[0] + '">' + m[1] + '</button>').join('') + '<button class="chip" data-act="toggleWeb">🌐 Look things up</button>';
}
const sheet = h => { $('#pane').innerHTML = '<button class="close" data-act="close">✕</button>' + h; $('#sheet').classList.add('open'); };
const closeSheet = () => $('#sheet').classList.remove('open');

/* ---------- sending ---------- */
function newConv() { const c = { id: 'c' + Date.now(), title: 'New chat', msgs: [], t: Date.now() }; S.convs.unshift(c); S.active = c.id; return c; }
function friendly(code, msg) { return code === 'LIMIT' ? 'I have hit the free limit for now. Give it a minute, switch to ⚡ Quick, or try again later.' : code === 'KEY' ? 'The AI connection was refused. Check your key in Settings.' : code === 'NET' ? 'I cannot reach the AI service. Check your internet and try again.' : msg || 'Something went wrong. Please try again.'; }
function typeIn(i, full) {
  const target = full.length, step = Math.max(3, Math.ceil(target / 140)); typing = { i, shown: '' };
  const el = () => document.getElementById('t' + i);
  clearInterval(typeIn.h);
  typeIn.h = setInterval(() => {
    if (!typing) { clearInterval(typeIn.h); return; }
    let n = typing.shown.length + step; if (n < target) { while (n < target && !/\s/.test(full[n - 1])) n++; }
    typing.shown = full.slice(0, n); const e = el(), chat = $('#chat'), near = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 90;
    if (e) { e.innerHTML = md(typing.shown); e.classList.add('caret'); if (near) chat.scrollTop = chat.scrollHeight; }
    if (n >= target) { clearInterval(typeIn.h); typing = null; render(true); }
  }, 18);
}
async function send(text) {
  text = String(text || '').trim(); if (!text || busy) return;
  if (!ready()) { toast('Connect a free AI first (⚙ Settings).'); openSettings(); return; }
  if (!S.settings.models[S.settings.provider]) { toast('Pick a model in Settings first.'); openSettings(); return; }
  stopMic(); typing = null;
  let c = conv() || newConv();
  const history = c.msgs.filter(m => !m.error).map(m => ({ role: m.role, content: m.content }));
  c.msgs.push({ role: 'user', content: text }); if (c.title === 'New chat') c.title = text.slice(0, 44);
  $('#q').value = ''; autosize(); busy = true; stepText = 'Thinking…'; save(); render();
  const st = S.settings, llm = mkLLM();
  try {
    const r = await Vera.ask({ llm, question: text, history, mode: st.mode, web: st.web, nativeSearch: st.provider === 'gemini', tone: st.tone, profile: st.profile,
      search: q => Vera.webSearch(q, { tavilyKey: st.tavily }),
      onStep: (n, d) => { stepText = /Looking/.test(n) ? 'Looking that up…' : /Check|Second|Fix/.test(n) ? 'Double-checking…' : /Draft|Reply/.test(n) ? 'Writing…' : 'Thinking…'; const e = $('#stepTxt'); if (e) e.textContent = stepText; } });
    c.msgs.push({ role: 'assistant', content: r.text, meta: { steps: r.steps, issues: r.issues, sources: r.sources, calls: r.calls, usedSearch: r.usedSearch, followups: r.followups, kind: r.kind } });
    typing = { i: c.msgs.length - 1, shown: '' }; busy = false; save(); render(); typeIn(c.msgs.length - 1, r.text);
  } catch (e) {
    c.msgs.push({ role: 'assistant', error: true, content: friendly(e.code, e.message) }); busy = false; save(); render();
  }
}
function autosize() { const t = $('#q'); t.style.height = 'auto'; t.style.height = Math.min(150, t.scrollHeight) + 'px'; }

/* ---------- voice input ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition; let rec = null;
if (SR) $('#mic').style.display = 'grid';
function stopMic() { if (rec) { try { rec.stop(); } catch (e) {} rec = null; } $('#mic').classList.remove('on'); }
function toggleMic() {
  if (rec) { stopMic(); return; }
  try { rec = new SR(); rec.lang = navigator.language || 'en-US'; rec.interimResults = true; rec.continuous = false; const q = $('#q'), start = q.value ? q.value + ' ' : '';
    rec.onresult = e => { let s = ''; for (let i = 0; i < e.results.length; i++) s += e.results[i][0].transcript; q.value = start + s; autosize(); };
    rec.onend = () => { rec = null; $('#mic').classList.remove('on'); }; rec.onerror = () => { rec = null; $('#mic').classList.remove('on'); toast('Could not use the microphone. Allow access in your browser.'); };
    rec.start(); $('#mic').classList.add('on'); } catch (e) { toast('Voice input is not available here.'); }
}

/* ---------- settings ---------- */
function openSettings() {
  const st = S.settings, p = P();
  const models = st._list && st._listFor === st.provider ? st._list : (st.models[st.provider] ? [st.models[st.provider]] : []);
  let h = '<h2>Connect a free AI</h2><label class="l" style="margin-top:0">Provider</label><select id="sProv">' + Object.keys(Vera.PROVIDERS).map(k => '<option value="' + k + '"' + (st.provider === k ? ' selected' : '') + '>' + Vera.PROVIDERS[k].name + '</option>').join('') + '</select><div class="dim small" style="margin-top:6px">' + esc(p.note) + '</div>';
  if (p.needsBase) h += '<label class="l">Base URL</label><input type="text" id="sBase" value="' + esc(base()) + '" placeholder="https://api.openai.com/v1" autocomplete="off">';
  if (p.needsKey) h += '<label class="l">API key <a href="' + p.keyUrl + '" target="_blank" rel="noopener noreferrer" class="small">(get a free key)</a></label><input type="password" id="sKey" value="' + esc(key()) + '" autocomplete="off" placeholder="paste key here">' + (st.provider === 'gemini' && !key() && hasFEKey() ? '<button class="btn sm" style="margin-top:8px" data-act="feKey">Use the Gemini key saved in FE</button>' : '');
  else h += '<div class="note">Install Ollama from <a href="https://ollama.com/download" target="_blank" rel="noopener noreferrer">ollama.com</a>, run a model (for example <b>ollama pull qwen3:8b</b>), then start Ollama with <b>OLLAMA_ORIGINS=https://776vvfyn45-commits.github.io</b>. PC browser only.</div>';
  h += '<label class="l">Model</label><div class="row"><select id="sModel">' + (models.length ? models.map(m => '<option' + (st.models[st.provider] === m ? ' selected' : '') + '>' + esc(m) + '</option>').join('') : '<option value="">(tap Load list)</option>') + '</select><button class="btn" data-act="loadModels">Load list</button></div>';
  h += '<button class="btn pri block" style="margin-top:14px" data-act="saveConn">Save & test</button>';
  h += '<h2>You</h2><label class="l" style="margin-top:0">Your name</label><input type="text" id="sName" value="' + esc(st.name) + '" autocomplete="off"><label class="l">About you (so answers fit your life)</label><textarea id="sProf" class="sheetta" rows="4" placeholder="Example: I live in Germany. Small budget (about €100). Beginner investor. I train 4×/week. I build small web apps.">' + esc(st.profile) + '</textarea>';
  h += '<h2>Style</h2><div class="row"><div style="flex:1"><label class="l" style="margin-top:0">Tone</label><select id="sTone">' + [['gentle', 'Gentle'], ['direct', 'Direct'], ['blunt', 'Blunt and short']].map(t => '<option value="' + t[0] + '"' + (st.tone === t[0] ? ' selected' : '') + '>' + t[1] + '</option>').join('') + '</select></div><div style="flex:1"><label class="l" style="margin-top:0">Theme</label><select id="sTheme"><option value="dark"' + (st.theme !== 'light' ? ' selected' : '') + '>Dark</option><option value="light"' + (st.theme === 'light' ? ' selected' : '') + '>Light</option></select></div></div>';
  h += '<div class="dim small" style="margin-top:10px">⚡ Quick = fastest. 🧠 Smart = double-checks anything important (default). 🔬 Thorough = checks everything twice. More checking uses more of your free daily limit.</div>';
  h += '<label class="l">Optional: Tavily search key (better web results)</label><input type="password" id="sTav" value="' + esc(st.tavily) + '" autocomplete="off" placeholder="tvly-…"><button class="btn block" style="margin-top:12px" data-act="saveAll">Save these settings</button>';
  h += '<h2>Honesty test</h2><div class="dim small">Asks ' + Vera.REALITY_TESTS.length + ' trick questions (fake promises, flattery bait, false facts, math) and grades the answers.</div><button class="btn block" style="margin-top:8px" data-act="runTests">Run honesty test</button><div id="testOut"></div>';
  h += '<h2>Your data</h2><div class="dim small">Chats and keys stay only on this device.</div><div class="row" style="margin-top:8px"><button class="btn" data-act="export">Download backup</button><button class="btn danger" data-act="wipe">Erase all</button></div>';
  sheet(h);
}
function hasFEKey() { try { const j = JSON.parse(localStorage.getItem('fe_state_v1')); return !!(j && j.gemKey); } catch (e) { return false; } }
function readConn() { const st = S.settings; st.provider = $('#sProv').value; if ($('#sKey')) st.keys[st.provider] = $('#sKey').value.trim(); if ($('#sBase')) st.bases[st.provider] = $('#sBase').value.trim().replace(/\/+$/, ''); const m = $('#sModel').value; if (m) st.models[st.provider] = m; }
function readAll() { const st = S.settings; readConn(); st.tone = $('#sTone').value; st.theme = $('#sTheme').value; st.tavily = $('#sTav').value.trim(); st.name = $('#sName').value.trim(); st.profile = $('#sProf').value; applyTheme(); }
async function runTests() {
  const out = $('#testOut'); if (!ready() || !S.settings.models[S.settings.provider]) { toast('Connect a model first.'); return; }
  const st = S.settings, llm = mkLLM(); let pass = 0, h = '';
  for (const t of Vera.REALITY_TESTS) {
    out.innerHTML = h + '<div class="dim small" style="margin-top:8px">Testing: ' + esc(t.prompt.slice(0, 60)) + '…</div>';
    try { const r = await Vera.ask({ llm, question: t.prompt, history: [], mode: st.mode, web: false, tone: st.tone, profile: '' }); const g = Vera.gradeTest(t, r.text); if (g.pass) pass++;
      h += '<div class="card"><div class="' + (g.pass ? 'pass' : 'fail') + '">' + (g.pass ? 'PASS' : 'CHECK') + '</div><div class="small dim">' + esc(t.prompt) + '</div><details><summary class="small dim" style="cursor:pointer">Answer</summary><div class="small" style="white-space:pre-wrap;margin-top:6px">' + esc(r.text) + '</div></details></div>'; }
    catch (e) { h += '<div class="card"><div class="fail">ERROR</div><div class="small dim">' + esc(e.message) + '</div></div>'; if (e.code === 'LIMIT' || e.code === 'KEY') break; }
  }
  out.innerHTML = '<div style="margin-top:10px"><b>' + pass + ' / ' + Vera.REALITY_TESTS.length + ' passed</b> <span class="dim small">(automatic check; read the answers yourself)</span></div>' + h;
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  if (e.target.id === 'sheet') { closeSheet(); return; }
  const el = e.target.closest('[data-act]'); if (!el) return; const d = el.dataset;
  switch (d.act) {
    case 'send': send($('#q').value); break;
    case 'mic': toggleMic(); break;
    case 'newChat': typing = null; S.active = null; save(); render(); $('#q').focus(); break;
    case 'close': closeSheet(); render(); break;
    case 'settings': openSettings(); break;
    case 'history': sheet('<h2>Chats</h2>' + (S.convs.length ? S.convs.map(c => '<div class="conv' + (c.id === S.active ? ' on' : '') + '" data-act="open" data-id="' + c.id + '"><span>' + esc(c.title) + '</span><button class="btn sm danger" data-act="delConv" data-id="' + c.id + '">✕</button></div>').join('') : '<div class="dim">No chats yet.</div>')); break;
    case 'open': typing = null; S.active = d.id; save(); closeSheet(); render(); break;
    case 'delConv': S.convs = S.convs.filter(c => c.id !== d.id); if (S.active === d.id) S.active = null; save(); el.closest('.conv').remove(); render(); break;
    case 'mode': S.settings.mode = d.v; save(); render(true); break;
    case 'toggleWeb': S.settings.web = !S.settings.web; save(); render(true); toast('Looking things up online: ' + (S.settings.web ? 'on' : 'off')); break;
    case 'starter': send(STARTERS[+d.i][1]); break;
    case 'fu': { const c = conv(), m = c.msgs[c.msgs.length - 1]; send(m.meta.followups[+d.i]); break; }
    case 'copy': { const m = conv().msgs[+d.i]; try { await navigator.clipboard.writeText(m.content); toast('Copied'); } catch (er) { toast('Copy is not allowed here.'); } break; }
    case 'regen': { const c = conv(); if (!c) break; c.msgs.pop(); const u = c.msgs.pop(); save(); render(); if (u) send(u.content); break; }
    case 'retry': { const c = conv(); if (!c) break; c.msgs.pop(); const u = c.msgs.pop(); save(); render(); if (u) send(u.content); break; }
    case 'feKey': try { S.settings.keys.gemini = JSON.parse(localStorage.getItem('fe_state_v1')).gemKey; save(); openSettings(); } catch (er) {} break;
    case 'loadModels': { readConn(); toast('Loading models…', 8000); try { const ids = await Vera.listModels(S.settings.provider, { key: key(), base: base() || undefined }); S.settings._list = ids; S.settings._listFor = S.settings.provider; if (!S.settings.models[S.settings.provider] || ids.indexOf(S.settings.models[S.settings.provider]) === -1) S.settings.models[S.settings.provider] = Vera.pickModel(S.settings.provider, ids); save(); openSettings(); toast(ids.length + ' models found.'); } catch (er) { toast(er.message, 6000); } break; }
    case 'saveConn': { readConn(); if (P().needsKey && !key()) { toast('Paste a key first.'); break; } if (P().needsBase && !base()) { toast('Paste the base URL first.'); break; } if (!S.settings.models[S.settings.provider]) { toast('Tap "Load list" and pick a model.'); break; }
      toast('Testing…', 15000); try { const r = await mkLLM()([{ role: 'user', content: 'Reply with the single word: ready' }], { maxTokens: 60, temperature: 0 }); save(); toast(r.text ? 'Connected ✓' : 'Connected, but the model answered with nothing. Try another model.'); render(true); } catch (er) { toast(er.message, 7000); } break; }
    case 'saveAll': readAll(); save(); toast('Saved.'); break;
    case 'runTests': readAll(); save(); runTests(); break;
    case 'export': { const b = new Blob([JSON.stringify(Object.assign({}, S, { settings: Object.assign({}, S.settings, { keys: {}, tavily: '' }) }))], { type: 'application/json' }), u = URL.createObjectURL(b), l = document.createElement('a'); l.href = u; l.download = 'vera-backup.json'; l.click(); setTimeout(() => URL.revokeObjectURL(u), 2000); toast('Backup saved (keys not included).'); break; }
    case 'wipe': if (confirm('Erase all chats, settings and keys on this device?')) { try { localStorage.removeItem(KEY); } catch (er) {} location.reload(); } break;
  }
});
document.addEventListener('change', e => { if (e.target.id === 'sProv') { readConn(); S.settings._list = null; save(); openSettings(); } });
$('#q').addEventListener('input', autosize);
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(hover:hover)').matches) { e.preventDefault(); send($('#q').value); } });

applyTheme(); renderModes(); render(); restore();
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
})();
</script>
